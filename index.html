<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>my closet</title>
<meta name="theme-color" content="#f3f3f3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand+SC&display=swap" rel="stylesheet">
<style>
:root{--ink:#14161c;--panel:#fff;--soft:#eef0f4;--line:#d9dde5;--hand:"Patrick Hand SC","Segoe Print","Bradley Hand","Comic Sans MS",cursive;--scrim:linear-gradient(180deg,rgba(255,255,255,0) 35%,rgba(70,75,90,.4))}
:root[data-theme="dark"]{--ink:#f2f4f8;--panel:#1b1f2a;--soft:#262b38;--line:#333a4b;--scrim:rgba(10,12,18,.82);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f2f4f8;--panel:#1b1f2a;--soft:#262b38;--line:#333a4b;--scrim:rgba(10,12,18,.82);color-scheme:dark}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;color:var(--ink);font:17px/1.4 var(--hand);padding-bottom:150px;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
body::before{background:var(--bgimg,none) center/cover no-repeat}
body::after{background:var(--scrim)}
button{font-family:inherit}
:focus-visible{outline:3px solid #2db6ff;outline-offset:2px}
.top{display:grid;grid-template-columns:240px 1fr 240px;align-items:start;gap:12px;padding:14px 22px 6px;max-width:1500px;margin:auto}
.logo{margin:0;font:400 2.6rem/1 "Gochi Hand",var(--hand);transform-origin:10% 70%;animation:wiggle 2.6s ease-in-out infinite}
.logo:hover{animation-duration:.7s}
@keyframes wiggle{0%,100%{transform:rotate(-2.5deg)}25%{transform:rotate(2.5deg) translateY(-2px)}50%{transform:rotate(-1.5deg)}75%{transform:rotate(3deg) translateY(-1px)}}
.mid{min-width:0}
.search{width:100%;border:0;border-radius:14px;background:#72c9ff;padding:14px 18px;text-align:center;font:700 1.1rem var(--hand);letter-spacing:1px;color:#0b1a2a;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.search::placeholder{color:#0b1a2a;opacity:.85}
.tabs{display:flex;justify-content:center;gap:22px;overflow-x:auto;margin-top:8px;padding-bottom:4px}
.tab{background:none;border:0;border-bottom:3px solid transparent;font-size:1.1rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink);padding:2px 4px;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{border-color:var(--ink)}
.ctl{display:flex;gap:14px;justify-content:flex-end;align-items:center;position:relative}
.tog{display:flex;gap:4px;padding:6px 8px;border:0;border-radius:14px;background:linear-gradient(90deg,#43e0d2,#0a4fb5);box-shadow:0 6px 14px rgba(0,0,0,.25);cursor:pointer}
.tog span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.tog svg{width:24px;height:24px;stroke:#111;fill:none;stroke-width:2;stroke-linecap:round}
:root[data-theme="dark"] .mn,:root:not([data-theme="dark"]) .sn{background:rgba(255,255,255,.55)}
.me{width:50px;height:50px;border-radius:50%;border:2px solid #8ec9f0;background:#2db6ff;color:#fff;font-size:1.6rem;line-height:1;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.25)}
#menu{position:absolute;right:0;top:58px;background:var(--panel);border-radius:12px;padding:6px;box-shadow:0 12px 34px rgba(0,0,0,.3);display:grid;min-width:200px;z-index:20}
#menu[hidden]{display:none}
.mi{background:none;border:0;padding:10px 12px;text-align:left;font-size:1.05rem;color:var(--ink);border-radius:8px;cursor:pointer}
.mi:hover{background:var(--soft)}
.layout{display:grid;grid-template-columns:1fr 230px;gap:18px;max-width:1500px;margin:auto;padding:0 22px}
.stagewrap{display:grid;grid-template-columns:100px 1fr 100px;align-items:center;min-height:clamp(320px,58vh,600px)}
.arr{background:none;border:0;padding:0;cursor:pointer;justify-self:center;transition:transform .15s}
.arr svg{width:90px;height:72px;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
#rgt svg{transform:scaleX(-1)}
.arr:hover{transform:scale(1.08)}.arr:active{transform:scale(.92)}
.stage{display:grid;place-items:center}
.item{width:100%;display:grid;justify-items:center;gap:8px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.pic{width:min(100%,calc(clamp(240px,46vh,440px)*.8));aspect-ratio:4/5;background:rgba(255,255,255,.92);border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.3);display:grid;place-items:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}
.sw{width:46%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2);display:block}
.cap{text-align:center;margin:0}
.cap b{font:400 1.9rem/1.1 "Gochi Hand",var(--hand);display:block}
.cap span{display:inline-flex;align-items:center;gap:6px;opacity:.85}
.dot{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.lnk{background:none;border:0;color:var(--ink);opacity:.65;text-decoration:underline;cursor:pointer;font-size:.95rem}
.empty{text-align:center;font-size:1.5rem;padding:30px 10px;max-width:420px}
.collage{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:640px}
.mini{width:128px;text-align:center;font-size:.95rem}
.mini .pic{width:100%;border-radius:12px;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.acts{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.solo .arr,.solo .acts{visibility:hidden}
.side{display:grid;gap:14px;align-content:start;padding-top:8px}
.gbtn{font-size:1.15rem;letter-spacing:1px;font-weight:700;text-transform:uppercase;color:#111;border:0;border-radius:16px;padding:14px 20px;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.25);transition:transform .15s}
.gbtn:hover{transform:translateY(-2px) scale(1.02)}.gbtn:active{transform:scale(.96)}
.g1{background:linear-gradient(90deg,#9b4dff,#ff8c4a)}
.g2{background:linear-gradient(90deg,#4dff4d,#00e5ff,#0a8bff)}
.g3{background:linear-gradient(90deg,#7a1015,#c4262c);color:#fff}
.g4{background:linear-gradient(90deg,#ff3b30,#ff8a3d)}
.g5{background:linear-gradient(90deg,#6a3de8,#1fd8b5);min-width:170px}
.g4.on{outline:3px solid var(--ink)}
.heart{color:#e53935;font-size:1.5rem;vertical-align:-2px;display:inline-block}
.pulse .heart{animation:pulse .5s}
.pic{position:relative}
.fv{position:absolute;top:10px;right:12px;color:#e53935;font-size:2rem;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));z-index:1}
@keyframes pulse{40%{transform:scale(1.7)}}
.binbox{position:fixed;left:14px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;z-index:5}
.bin{background:none;border:0;padding:0;cursor:pointer;position:relative;transform-origin:50% 100%}
.bin svg{width:120px;display:block}
.bin.wig{animation:wig .7s ease}
@keyframes wig{0%,100%{transform:rotate(0)}15%{transform:rotate(-10deg)}35%{transform:rotate(9deg)}55%{transform:rotate(-6deg)}75%{transform:rotate(4deg)}}
.badge{position:absolute;top:-8px;right:-4px;min-width:28px;height:28px;border-radius:14px;background:#e53935;color:#fff;display:grid;place-items:center;font-size:1rem;padding:0 6px}
.badge[hidden]{display:none}
.catwrap{position:relative;margin-left:-14px}
.cat{width:100px;display:block;transform-origin:50% 100%;animation:br 3.5s ease-in-out infinite;filter:drop-shadow(0 0 1px rgba(255,255,255,.7))}
@keyframes br{50%{transform:scale(1.04,1.07)}}
.z{position:absolute;font:400 1.4rem "Gochi Hand",var(--hand);opacity:0;animation:zz 3s infinite}
.eyes-o,.bang{opacity:0}
.bang{position:absolute;left:12px;top:-20px;font:400 2rem "Gochi Hand",var(--hand);color:#e53935}
.catwrap.scared .eyes-o,.catwrap.scared .bang{opacity:1}
.catwrap.scared .eyes-c,.catwrap.scared .z{opacity:0}
.catwrap.scared .cat{animation:scare 1.3s ease-out}
.catwrap.scared .bang{animation:bangpop .4s ease-out}
@keyframes scare{0%{transform:none}12%{transform:translateY(-28px) scale(.9,1.2)}28%{transform:translateY(0) scale(1.12,.88)}42%{transform:translateX(-4px) rotate(-4deg) scale(1.08)}56%{transform:translateX(4px) rotate(4deg) scale(1.08)}72%{transform:translateX(-2px) scale(1.04)}100%{transform:none}}
@keyframes bangpop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}50%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
dialog{border:0;border-radius:18px;padding:0;width:min(460px,calc(100% - 24px));background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);font-family:var(--hand);font-size:1.05rem}
dialog::backdrop{background:rgba(10,14,22,.55)}
dialog form{display:grid;gap:12px;padding:20px}
dialog h3{margin:0;font:400 1.9rem "Gochi Hand",var(--hand)}
dialog label{display:grid;gap:4px;opacity:.9}
dialog input,dialog select{font:1rem system-ui,sans-serif;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);width:100%}
dialog input[type=color]{padding:2px;height:42px}
dialog button{font:inherit;border-radius:10px;padding:9px 16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
dialog .pri{background:linear-gradient(90deg,#6a3de8,#1fd8b5);border:0;color:#111;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.pv{height:150px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;overflow:hidden;background:var(--soft);cursor:pointer}
.pv img{width:100%;height:100%;object-fit:cover}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;max-height:44vh;overflow:auto}
.pk{position:relative;aspect-ratio:1;border-radius:10px!important;border:3px solid transparent!important;background:var(--soft)!important;overflow:hidden;padding:0!important;display:grid;place-items:center}
.pk img{width:100%;height:100%;object-fit:cover}
.pk[aria-pressed=true]{border-color:#1fb5a0!important}
.pk[aria-pressed=true]::after{content:"\2713";position:absolute;top:2px;right:2px;background:#1fb5a0;color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:.9rem}
.mus{width:50px;height:50px;border-radius:50%;border:0;background:linear-gradient(135deg,#9b4dff,#ff8c4a);color:#fff;font-size:1.6rem;line-height:1;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.mus.on{font-size:1.1rem;animation:ring 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(155,77,255,.6)}100%{box-shadow:0 0 0 14px rgba(155,77,255,0)}}
#hint{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);color:var(--ink);padding:8px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:1.05rem;z-index:15;animation:hintbob 1.6s ease-in-out infinite}
#hint[hidden]{display:none}
@keyframes hintbob{50%{transform:translateY(-5px)}}
@media (max-aspect-ratio:1/1){body::before{background-image:var(--bgimgp,var(--bgimg,none))}}
html{-webkit-text-size-adjust:100%}
dialog{max-height:calc(100dvh - 24px);overflow:auto}
@media (max-width:820px){
:root{--ph:clamp(200px,calc(100dvh - 410px),460px)}
html,body{overscroll-behavior:none}
body{display:flex;flex-direction:column;min-height:100dvh;padding-bottom:0;-webkit-tap-highlight-color:transparent}
button,.tab{touch-action:manipulation}
.top{width:100%;margin:0 auto;grid-template-columns:1fr auto;gap:8px;padding:10px 14px 2px}
.mid{grid-column:1/-1;order:3}
.logo{font-size:2.1rem}
.ctl{gap:8px}
.mus,.me{width:42px;height:42px;font-size:1.3rem}
.tog{padding:5px 6px}.tog span{width:30px;height:30px}
.search{padding:11px 14px;font-size:1rem}
.tabs{gap:16px;justify-content:safe center;margin-top:6px}
.layout{width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:0 10px;min-height:0;gap:6px}
.layout>div:first-child{flex:1;display:flex;flex-direction:column;min-height:0}
.stagewrap{position:relative;display:flex;align-items:center;justify-content:center;flex:1;min-height:0}
.stage{width:100%}
.item{width:100%}
.pic{width:min(78%,calc(var(--ph)*.8))}
.cap b{font-size:1.6rem}
.arr{position:absolute;top:50%;translate:0 -50%;z-index:3;width:48px;height:48px;display:grid;place-items:center}
#lft{left:-4px}#rgt{right:-4px}
.arr svg{width:44px;height:36px}
.acts{gap:10px;flex-wrap:nowrap;margin-top:4px}
.acts .gbtn{flex:1;min-width:0;padding:12px 6px;font-size:1rem}
.side{grid-template-columns:1fr 1fr;gap:8px;margin:0 0 calc(10px + env(safe-area-inset-bottom,0px)) 112px;padding-top:0}
.side .gbtn{font-size:.85rem;padding:8px 6px;line-height:1.1;min-height:44px;letter-spacing:.5px;border-radius:14px}
.binbox{left:6px;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.bin svg{width:66px}.cat{width:54px}.catwrap{margin-left:-10px}
.badge{min-width:24px;height:24px;font-size:.85rem}
#hint{position:absolute;top:4px;left:50%;right:auto;bottom:auto;translate:-50% 0;z-index:6;white-space:nowrap}
.catwrap .z:nth-child(1){left:22px!important;top:4px!important}
.catwrap .z:nth-child(2){left:32px!important;top:-8px!important}
.catwrap .z:nth-child(3){left:42px!important;top:-20px!important}
}
@media (max-width:380px){
.logo{font-size:1.8rem}
.tog span{width:26px;height:26px}
.mus,.me{width:38px;height:38px}
.side{margin-left:100px}
.side .gbtn{font-size:.78rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="ag" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#5a4fe6"/><stop offset="1" stop-color="#20d3bd"/></linearGradient></defs></svg>

<header class="top">
  <h1 class="logo">my closet</h1>
  <div class="mid">
    <input id="q" class="search" type="search" placeholder="SEARCH HERE...." aria-label="Search">
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
  <div class="ctl">
    <button class="tog" id="theme" aria-label="Switch light and dark mode">
      <span class="mn"><svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z" fill="#111"/></svg></span>
      <span class="sn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></span>
    </button>
    <button class="mus" id="mus" aria-label="Play music">&#9834;</button>
    <button class="me" id="me" aria-label="Menu">&hellip;</button>
    <div id="menu" hidden>
      <button class="mi" id="mbg">Change background</button>
      <button class="mi" id="mrs">Reset background</button>
      <button class="mi" id="mex">Save backup</button>
      <button class="mi" id="mim">Load backup</button>
      <button class="mi" id="mmu">Choose music</button>
      <button class="mi" id="mnx">Next song</button>
      <button class="mi" id="mrm">Remove music</button>
      <label class="mi" style="display:flex;gap:8px;align-items:center">Volume <input type="range" id="vol" min="0" max="1" step=".05" style="flex:1"></label>
      <div class="mi" id="mnow" style="opacity:.7;cursor:default;font-size:.95rem"></div>
    </div>
  </div>
</header>

<main class="layout">
  <div>
    <section class="stagewrap">
      <div id="hint" hidden>♪ Tap to start music</div>
      <button class="arr" id="lft" aria-label="Previous item"><svg viewBox="0 0 100 80"><path d="M0 40 L38 0 L38 22 L100 22 L100 58 L38 58 L38 80 Z" fill="url(#ag)"/></svg></button>
      <div class="stage" id="stage"></div>
      <button class="arr" id="rgt" aria-label="Next item"><svg viewBox="0 0 100 80"><path d="M0 40 L38 0 L38 22 L100 22 L100 58 L38 58 L38 80 Z" fill="url(#ag)"/></svg></button>
    </section>
    <div class="acts" id="acts">
      <button class="gbtn g5" id="wash">ADD TO WASH</button>
      <button class="gbtn g5" id="fav"><span id="favt">ADD TO FAV</span> <span class="heart">&#9829;</span></button>
    </div>
  </div>
  <aside class="side">
    <button class="gbtn g1" id="add">+ ADD NEW</button>
    <button class="gbtn g2" id="outfit">PLAN NEW OUTFIT</button>
    <button class="gbtn g3" id="coll">CREATE COLLECTION</button>
    <button class="gbtn g4" id="favs">FAVORITES</button>
  </aside>
</main>

<div class="binbox">
  <button class="bin" id="bin" aria-label="Open the wash basket">
    <svg viewBox="0 0 120 130" aria-hidden="true"><path d="M14 32 L24 118 Q25 126 33 126 L87 126 Q95 126 96 118 L106 32 Z" fill="#a9b2dc" stroke="#1c2033" stroke-width="3" stroke-linejoin="round"/><g stroke="#1c2033" stroke-width="2.5" stroke-linecap="round"><path d="M34 40 L38 118"/><path d="M47 42 L48 120"/><path d="M60 42 V120"/><path d="M73 42 L72 120"/><path d="M86 40 L82 118"/></g><ellipse cx="60" cy="31" rx="47" ry="11" fill="#1d2036" stroke="#a9b2dc" stroke-width="4"/></svg>
    <span class="badge" id="badge" hidden>0</span>
  </button>
  <div class="catwrap" aria-hidden="true">
    <span class="z" style="left:66px;top:2px">z</span><span class="z" style="left:80px;top:-10px;animation-delay:1s">z</span><span class="z" style="left:94px;top:-22px;animation-delay:2s">z</span>
    <svg class="cat" viewBox="0 0 110 70"><g fill="#1c1c22"><ellipse cx="58" cy="46" rx="44" ry="20"/><circle cx="24" cy="44" r="15"/><path d="M12 33 L14 18 L24 29Z M26 29 L36 19 L36 35Z"/></g><path d="M98 50 Q112 40 100 28" stroke="#1c1c22" stroke-width="7" fill="none" stroke-linecap="round"/><path class="eyes-c" d="M17 44 q3 3 6 0 M27 44 q3 3 6 0" stroke="#8a8fa3" stroke-width="1.6" fill="none" stroke-linecap="round"/><g class="eyes-o"><circle cx="19" cy="42" r="4.4" fill="#fff"/><circle cx="30" cy="42" r="4.4" fill="#fff"/><circle cx="19" cy="42.5" r="2" fill="#111"/><circle cx="30" cy="42.5" r="2" fill="#111"/></g></svg>
    <span class="bang">!</span>
  </div>
</div>

<input type="file" id="bgfile" accept="image/*" hidden>
<input type="file" id="musfile" accept="audio/*" multiple hidden>
<input type="file" id="impfile" accept="application/json" hidden>

<dialog id="dlg"><form id="f">
  <h3>Add to your closet</h3>
  <div class="pv" id="pv" tabindex="0" role="button" aria-label="Choose a photo">Tap to add a photo</div>
  <input type="file" id="photo" accept="image/*" hidden>
  <label>Name<input id="name" required placeholder="Blue jeans"></label>
  <div class="two"><label>Type<select id="type"></select></label><label>Size<input id="size" placeholder="M"></label></div>
  <label>Color<input type="color" id="color" value="#2b3a67"></label>
  <div class="row"><button type="button" data-close>Cancel</button><button class="pri">Save item</button></div>
</form></dialog>

<dialog id="bld"><form id="bf">
  <h3 id="bt"></h3>
  <label>Name<input id="bn" required></label>
  <div>Tap the clothes to include:</div>
  <div class="pick" id="pick"></div>
  <div class="row"><button type="button" id="shuf">Shuffle</button><button type="button" data-close>Cancel</button><button class="pri">Save</button></div>
</form></dialog>

/* woosh sound (made with Web Audio, no file needed) */
let ac;
function woosh(dir){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    const t=ac.currentTime,d=.38,n=ac.createBuffer(1,Math.floor(ac.sampleRate*d),ac.sampleRate),b=n.getChannelData(0);
    for(let i=0;i<b.length;i++)b[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/b.length);
    const s=ac.createBufferSource();s.buffer=n;
    const f=ac.createBiquadFilter();f.type="bandpass";f.Q.value=1.1;
    f.frequency.setValueAtTime(dir>0?600:2600,t);f.frequency.exponentialRampToValueAtTime(dir>0?3200:500,t+d);
    const g=ac.createGain();g.gain.setValueAtTime(.55,t);
    s.connect(f);f.connect(g);
    if(ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=-dir*.6;g.connect(p);p.connect(ac.destination)}else g.connect(ac.destination);
    s.start(t);
  }catch(e){}
}
/* click sound for every button except the left and right arrows */
function click(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type="triangle";o.frequency.setValueAtTime(950,t);o.frequency.exponentialRampToValueAtTime(380,t+.06);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.1);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.12);
  }catch(e){}
}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button,.tab,.pk,[role=button]");if(b&&!b.closest("#lft,#rgt"))click()},true);
/* trash can rattle and scared-cat sounds */
function sfxCtx(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}
function noiseBurst(c,t,len,type,freq,q,gain,pow){
  const n=c.createBuffer(1,Math.floor(c.sampleRate*len),c.sampleRate),b=n.getChannelData(0);
  for(let k=0;k<b.length;k++)b[k]=(Math.random()*2-1)*Math.pow(1-k/b.length,pow);
  const s=c.createBufferSource();s.buffer=n;
  const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=c.createGain();g.gain.value=gain;
  s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);
}
function binSound(){
  try{
    const c=sfxCtx(),t=c.currentTime;
    const o=c.createOscillator(),og=c.createGain();
    o.type="sine";o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(55,t+.18);
    og.gain.setValueAtTime(.6,t);og.gain.exponentialRampToValueAtTime(.001,t+.22);
    o.connect(og);og.connect(c.destination);o.start(t);o.stop(t+.25);
    [0,.09,.2,.31,.44,.57].forEach((d,i)=>noiseBurst(c,t+d,.07,"bandpass",1400+i*120,3,.55*(1-i*.14),3));
  }catch(e){}
}
function catSound(){
  try{
    const c=sfxCtx(),t=c.currentTime+.12;
    const o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
    o.type="sawtooth";
    o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(1050,t+.15);o.frequency.exponentialRampToValueAtTime(620,t+.5);
    l.frequency.value=22;lg.gain.value=25;l.connect(lg);lg.connect(o.frequency);
    f.type="bandpass";f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(1800,t+.2);f.Q.value=4;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.55);
    o.connect(f);f.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+.6);l.start(t);l.stop(t+.6);
    noiseBurst(c,t,.45,"highpass",3500,.7,.28,1.5);
  }catch(e){}
}

  const dx=br.left+br.width*.5-(r.left+r.width/2),dy=br.top+br.height*.2-(r.top+r.height/2);
  el.animate([{transform:"none",opacity:1},{transform:`translate(${dx*.5}px,${dy*.2-70}px) scale(.55) rotate(-10deg)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(.08) rotate(-30deg)`,opacity:.9}],{duration:750,easing:"ease-in",fill:"forwards"}).onfinish=()=>{
    b.classList.remove("wig");void b.offsetWidth;b.classList.add("wig");binSound();catSound();
    const cw=document.querySelector(".catwrap");cw.classList.remove("scared");void cw.offsetWidth;cw.classList.add("scared");setTimeout(()=>cw.classList.remove("scared"),1500);
    it.wash=true;saveI();busy=false;render();draw(true)};
};
$("fav").onclick=()=>{
  const it=list[cur];if(!it||busy)return;
  const b=$("fav"),h=b.querySelector(".heart");
  if(it.fav){
    it.fav=false;saveI();b.classList.remove("pulse");void b.offsetWidth;b.classList.add("pulse");
    if(view.k==="fav")render();else draw(false);return}
  busy=true;
  const el=$("stage").firstElementChild,r=el.getBoundingClientRect(),hr=h.getBoundingClientRect();
  const dx=hr.left+hr.width/2-(r.left+r.width/2),dy=hr.top+hr.height/2-(r.top+r.height/2);
  el.animate([{transform:"none",opacity:1},{transform:`translate(${dx*.4}px,${dy*.3-40}px) scale(.5) rotate(8deg)`,opacity:1,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.04)`,opacity:.9}],{duration:650,easing:"ease-in",fill:"forwards"}).onfinish=()=>{
    it.fav=true;saveI();busy=false;heartBurst(h);draw(true)};
};
function heartBurst(h){
  const b=$("fav");b.classList.remove("pulse");void b.offsetWidth;b.classList.add("pulse");
  const r=h.getBoundingClientRect();
  for(let i=0;i<7;i++){
    const s=document.createElement("span");s.textContent="\u2665";
    s.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;color:#e53935;font-size:${12+Math.random()*10}px;pointer-events:none;z-index:40`;
    document.body.appendChild(s);
    const a=Math.PI*2*i/7,d=40+Math.random()*30;
    s.animate([{transform:"translate(-50%,-50%) scale(.6)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d-20}px)) scale(1.1)`,opacity:0}],{duration:700,easing:"ease-out"}).onfinish=()=>s.remove();
  }
}
$("favs").onclick=()=>{view=view.k==="fav"?{k:"all"}:{k:"fav"};cur=0;render()};
$("bin").onclick=()=>{view=view.k==="wash"?{k:"all"}:{k:"wash"};cur=0;render()};
$("tabs").onclick=e=>{const t=e.target.closest(".tab");if(!t)return;view={k:t.dataset.k,key:t.dataset.key};cur=0;render()};
$("q").oninput=()=>{cur=0;render()};
$("stage").addEventListener("click",e=>{
  if(e.target.id!=="del")return;const s=curSet();
  if(s){if(confirm("Delete this "+(s.kind==="outfit"?"outfit":"collection")+"? Your clothes stay in the closet.")){sets=sets.filter(x=>x.id!==s.id);saveS();view={k:"all"};cur=0;render()}return}
  const it=list[cur];if(it&&confirm("Delete this item?")){items=items.filter(x=>x.id!==it.id);saveI();render()}
});

/* add item */
function shrink(file,max=600,q=.78){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};im.onerror=()=>res("");im.src=r.result};r.onerror=()=>res("");r.readAsDataURL(file)})}
const pv=()=>{$("pv").innerHTML=photo?`<img src="${photo}" alt="Preview">`:"Tap to add a photo"};
$("add").onclick=()=>{$("f").reset();photo="";pv();$("dlg").showModal()};
$("pv").onclick=()=>$("photo").click();
$("pv").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("photo").click()}};
$("photo").onchange=async e=>{const f=e.target.files[0];if(f){photo=await shrink(f);pv()}};
$("f").addEventListener("submit",e=>{
  e.preventDefault();
  items.unshift({id:Date.now().toString(36),name:$("name").value.trim(),type:$("type").value,color:$("color").value,size:$("size").value.trim(),img:photo});
  if(!saveI()){items.shift();return}
  $("dlg").close();view={k:"all"};$("q").value="";cur=0;render();
});
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());

/* outfits and collections */
function drawPick(){const a=items.filter(i=>!i.wash);
  $("pick").innerHTML=a.length?a.map(i=>`<button type="button" class="pk" data-id="${i.id}" aria-pressed="${sel.has(i.id)}" aria-label="${esc(i.name)}">${i.img?`<img src="${i.img}" alt="">`:`<span class="sw" style="background:${esc(i.color)}"></span>`}</button>`).join(""):"Add some clothes first."}
function openB(m){bmode=m;sel=new Set();$("bt").textContent=m==="outfit"?"Plan a new outfit":"Create a collection";$("bn").value="";$("shuf").hidden=m!=="outfit";drawPick();$("bld").showModal()}
$("outfit").onclick=()=>openB("outfit");$("coll").onclick=()=>openB("collection");
$("pick").onclick=e=>{const b=e.target.closest(".pk");if(!b)return;const id=b.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);drawPick()};
$("shuf").onclick=()=>{sel=new Set();["Tops","Bottoms","Shoes","Outerwear"].forEach(t=>{const a=items.filter(i=>!i.wash&&i.type===t);if(a.length&&(t!=="Outerwear"||Math.random()<.5))sel.add(a[Math.random()*a.length|0].id)});drawPick()};
$("bf").addEventListener("submit",e=>{
  e.preventDefault();if(!sel.size)return alert("Pick at least one item.");
  const s={id:Date.now().toString(36),kind:bmode,name:$("bn").value.trim(),ids:[...sel]};
  sets.push(s);if(!saveS()){sets.pop();return}
  $("bld").close();$("q").value="";view={k:"set",key:s.id};cur=0;render();
});

/* menu, background, backup */
/* music (Web Audio: loops, and also works where <audio> files are blocked) */
const KV="my-closet-vol",DEFMUS="";
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("my-closet-db",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvGet=async k=>{try{const d=await idb();return await new Promise(res=>{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res()})}catch(e){}};
const kvSet=async(k,v)=>{try{const d=await idb();return await new Promise(res=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)})}catch(e){return false}};
let vol=.6;try{const v=parseFloat(localStorage.getItem(KV));if(v>=0&&v<=1)vol=v}catch(e){}
$("vol").value=vol;
let tracks=[],ti=0,mc,mg,msrc=null,defBuf=null,userPaused=false;
function mctx(){if(!mc){mc=new (window.AudioContext||window.webkitAudioContext)();mg=mc.createGain();mg.gain.value=vol;mg.connect(mc.destination);mc.onstatechange=updMus}return mc}
const hasMusic=()=>!!(tracks.length||defBuf);
function updMus(){
  const on=!!mc&&mc.state==="running"&&!!msrc;
  $("mus").classList.toggle("on",on);$("mus").textContent=on?"\u275A\u275A":"\u266A";
  $("mus").setAttribute("aria-label",on?"Pause music":"Play music");
  $("mnow").textContent=tracks.length?"Now: "+tracks[ti].name:defBuf?"Now: pyro (slowed)":"No music yet";
  $("hint").hidden=!(msrc&&!userPaused&&mc.state!=="running");
}
const decode=ab=>new Promise((res,rej)=>mctx().decodeAudioData(ab,res,rej));
function b64buf(d){const s=atob(d.split(",")[1]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
function stopSrc(){if(msrc){msrc.onended=null;try{msrc.stop()}catch(e){}msrc.disconnect();msrc=null}}
function startSrc(buf,loop){stopSrc();const s=mctx().createBufferSource();s.buffer=buf;s.loop=loop;s.connect(mg);s.onended=()=>{if(msrc===s&&!loop)advance()};msrc=s;s.start();updMus()}
const wake=()=>{if(!userPaused&&mc&&hasMusic()&&mc.state!=="running")mc.resume().catch(()=>{})};
async function playTrack(i){ti=i;const b=await decode(await tracks[i].blob.arrayBuffer());startSrc(b,tracks.length===1);wake()}
function advance(){if(tracks.length>1)playTrack((ti+1)%tracks.length).catch(()=>{})}
async function useDef(){if(!DEFMUS)return;defBuf=defBuf||await decode(b64buf(DEFMUS));startSrc(defBuf,true)}
$("mus").onclick=()=>{if(!hasMusic())return $("musfile").click();mctx();if(mc.state==="running"){userPaused=true;mc.suspend()}else{userPaused=false;mc.resume().catch(()=>{})}};
$("mmu").onclick=()=>$("musfile").click();
$("musfile").onchange=async e=>{const fs=[...e.target.files];e.target.value="";if(!fs.length)return;const old=tracks;tracks=fs.map(f=>({name:f.name.replace(/\.[^.]+$/,""),blob:f}));try{await playTrack(0)}catch(x){tracks=old;return alert("Couldn\u2019t read that audio file.")}userPaused=false;wake();if(!await kvSet("tracks",tracks))alert("Couldn\u2019t save the music in this browser, so it will be gone next visit.")};
$("mnx").onclick=advance;
$("mrm").onclick=async()=>{tracks=[];kvSet("tracks",[]);if(DEFMUS){await useDef();userPaused=false;wake()}else stopSrc();updMus()};
$("vol").oninput=e=>{vol=+e.target.value;if(mg)mg.gain.value=vol;S(KV,e.target.value)};
["pointerdown","pointerup","touchend","keydown","click"].forEach(v=>addEventListener(v,e=>{if(!(e.target.closest&&e.target.closest("#mus")))wake()},true));
(async()=>{mctx();const t=await kvGet("tracks");if(Array.isArray(t)&&t.length)tracks=t;try{if(tracks.length)await playTrack(0);else await useDef()}catch(e){}updMus();wake()})();

$("me").onclick=e=>{e.stopPropagation();$("menu").hidden=!$("menu").hidden};
addEventListener("click",e=>{if(!e.target.closest("#menu"))$("menu").hidden=true});
$("mbg").onclick=()=>$("bgfile").click();
$("bgfile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const d=await shrink(f,1600,.7);if(!d)return alert("Couldn\u2019t read that image.");if(S(KB,d))setBg(d)};
$("mrs").onclick=()=>{try{localStorage.removeItem(KB)}catch(e){}setBg(DEF,DEFP)};
$("mex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({items,sets})],{type:"application/json"}));a.download="my-closet-backup.json";a.click()};
$("mim").onclick=()=>$("impfile").click();
$("impfile").onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text()),a=Array.isArray(d)?d:d.items;if(!Array.isArray(a))throw 0;items=a;sets=Array.isArray(d.sets)?d.sets:[];saveI();saveS();view={k:"all"};cur=0;render()}catch(x){alert("That file isn\u2019t a valid closet backup.")}e.target.value=""};
render();
</script>
</body>
</html>
